[comment]
allow = false

[[grant]]
paths = [
    "crates/*/src/**/*.rs",
    "crates/*/tests/**/*.rs",
    "packages/*/tests/**/*.test.ts",
    "packages/*/tests/**/*.test.tsx",
]
syntax = "test"

[[grant]]
paths = [
    "crates/*/tests/**/*.rs",
    "crates/cli/src/args.rs",
    "crates/cli/src/commands.rs",
    "crates/cli/src/commands/runtime.rs",
    "crates/cli/src/main.rs",
    "crates/cli/src/update.rs",
    "crates/cli/src/world.rs",
    "crates/core/src/paths.rs",
    "packages/*/src/lib.ts",
    "packages/*/tests/**/*.test.ts",
    "packages/*/tests/**/*.test.tsx",
]
syntax = "environment"

[limit]
block = 4
fanout = 10
file = 300
markup = 8
param = 4
path = 3

[module]
roots = [
    "crates/*/src",
    "crates/*/tests",
    "packages/*/lib",
    "packages/*/src",
    "packages/*/tests",
]

[scan]
exclude = [
    "**/dist/**",
    "**/node_modules/**",
    "**/target/**",
]
include = [
    "crates/**/*.rs",
    "packages/**/*.css",
    "packages/**/*.scss",
    "packages/**/*.ts",
    "packages/**/*.tsx",
]

[word]
single = true
