name: release-stable

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to release from"
        required: true
        default: main
        type: string
      version_override:
        description: "Optional stable version override, for example v0.1.3"
        required: false
        default: ""
        type: string

env:
  RELEASE_CHANNEL: stable

jobs:
  metadata:
    runs-on: docker
    container:
      image: mirror.perish.lan/ci/deno
    env:
      STABLE_VERSION_OVERRIDE: ${{ inputs.version_override }}
      R2_ACCESS_PROBE_NAME: release-stable
      RELEASE_CHANNEL: stable
      SIDECAR_RELEASES_PUBLIC_URL: ${{ vars.SIDECAR_RELEASES_PUBLIC_URL }}
      SIDECAR_RELEASES_S3_AK: ${{ secrets.SIDECAR_RELEASES_S3_AK }}
      SIDECAR_RELEASES_S3_BUCKET: ${{ secrets.SIDECAR_RELEASES_S3_BUCKET }}
      SIDECAR_RELEASES_S3_SK: ${{ secrets.SIDECAR_RELEASES_S3_SK }}
      SIDECAR_RELEASES_S3_URL: ${{ secrets.SIDECAR_RELEASES_S3_URL }}
    outputs:
      base_version: ${{ steps.stable.outputs.base_version }}
      release_version: ${{ steps.stable.outputs.release_version }}
      state_source: ${{ steps.stable.outputs.state_source }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Validate R2 access
        run: bash .forgejo/scripts/release/r2/check.sh

      - name: Resolve stable metadata
        id: stable
        run: python3 .forgejo/scripts/release/metadata/stable.py

  verify:
    needs: metadata
    runs-on: docker
    container:
      image: mirror.perish.lan/ci/deno
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Format
        run: cargo fmt --all --check

      - name: Test
        run: cargo test --locked --workspace

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: CLI smoke
        run: cargo run --locked -p sidecar -- doctor --config examples/minimal.toml

      - name: Install pinned negentropy
        run: |
          set -eu
          curl -fsSL https://releases.negentropy.perish.uk/manage.sh -o "$RUNNER_TEMP/manage-negentropy.sh"
          sh "$RUNNER_TEMP/manage-negentropy.sh" install --channel stable --bin-dir "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Negentropy
        run: negentropy --strict .

  build:
    needs: [metadata, verify]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos
            target: aarch64-apple-darwin
            archive: sidecar-aarch64-apple-darwin.tar.gz
          - runner: macos
            target: x86_64-apple-darwin
            archive: sidecar-x86_64-apple-darwin.tar.gz
          - runner: windows
            target: x86_64-pc-windows-msvc
            archive: sidecar-x86_64-pc-windows-msvc.zip
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Add target
        run: rustup target add ${{ matrix.target }}

      - name: Package release artifact
        if: runner.os != 'Windows'
        env:
          RELEASE_CHANNEL: stable
          SIDECAR_RELEASES_PUBLIC_URL: ${{ vars.SIDECAR_RELEASES_PUBLIC_URL }}
          TARGET: ${{ matrix.target }}
        run: sh .forgejo/scripts/release/assets/package.sh "${{ needs.metadata.outputs.release_version }}"

      - name: Package release artifact
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RELEASE_CHANNEL: stable
          SIDECAR_RELEASES_PUBLIC_URL: ${{ vars.SIDECAR_RELEASES_PUBLIC_URL }}
          TARGET: ${{ matrix.target }}
        run: ./.forgejo/scripts/release/assets/package.ps1 "${{ needs.metadata.outputs.release_version }}"

      - uses: actions/upload-artifact@v3
        with:
          name: release-${{ matrix.target }}
          path: dist/${{ needs.metadata.outputs.release_version }}/${{ matrix.archive }}

  publish:
    needs: [metadata, build]
    runs-on: docker
    container:
      image: mirror.perish.lan/ci/deno
    env:
      BASE_VERSION: ${{ needs.metadata.outputs.base_version }}
      RELEASE_CHANNEL: stable
      RELEASE_ROOT: dist/${{ needs.metadata.outputs.release_version }}
      RELEASE_VERSION: ${{ needs.metadata.outputs.release_version }}
      SIDECAR_RELEASES_PUBLIC_URL: ${{ vars.SIDECAR_RELEASES_PUBLIC_URL }}
      SIDECAR_RELEASES_S3_AK: ${{ secrets.SIDECAR_RELEASES_S3_AK }}
      SIDECAR_RELEASES_S3_BUCKET: ${{ secrets.SIDECAR_RELEASES_S3_BUCKET }}
      SIDECAR_RELEASES_S3_SK: ${{ secrets.SIDECAR_RELEASES_S3_SK }}
      SIDECAR_RELEASES_S3_URL: ${{ secrets.SIDECAR_RELEASES_S3_URL }}
      STATE_SOURCE: ${{ needs.metadata.outputs.state_source }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Package linux artifact
        env:
          RELEASE_CHANNEL: stable
          TARGET: x86_64-unknown-linux-gnu
        run: sh .forgejo/scripts/release/assets/package.sh "$RELEASE_VERSION"

      - uses: actions/download-artifact@v3
        with:
          path: dist/${{ needs.metadata.outputs.release_version }}

      - name: Gather artifacts
        run: |
          set -eu
          for dir in "$RELEASE_ROOT"/release-*; do
            [ -d "$dir" ] || continue
            mv "$dir"/* "$RELEASE_ROOT"/
            rmdir "$dir"
          done
          ls -l "$RELEASE_ROOT"

      - name: Create checksums
        run: sh .forgejo/scripts/release/assets/checksums.sh "$RELEASE_VERSION" "$RELEASE_ROOT"

      - name: Accept release assets
        run: sh .forgejo/scripts/release/assets/verify.sh accept "$RELEASE_VERSION" "$RELEASE_ROOT"

      - name: Verify release archives
        run: sh .forgejo/scripts/release/assets/verify.sh verify "$RELEASE_VERSION" "$RELEASE_ROOT"

      - name: Publish to R2
        id: r2
        run: bash .forgejo/scripts/release/r2/publish.sh

      - name: Verify R2 publish
        env:
          R2_METADATA_URL: ${{ steps.r2.outputs.metadata_url }}
        run: bash .forgejo/scripts/release/r2/verify.sh

      - name: Tag release
        run: |
          set -eu
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_VERSION" >/dev/null 2>&1; then
            echo "tag $RELEASE_VERSION already on origin: skipping tag"
            exit 0
          fi
          git config user.name "forgejo-actions"
          git config user.email "actions@git.perish.top"
          git tag -a "$RELEASE_VERSION" -m "$RELEASE_VERSION"
          git push origin "refs/tags/$RELEASE_VERSION"

      - name: Publish summary
        env:
          R2_METADATA_URL: ${{ steps.r2.outputs.metadata_url }}
          R2_VERSION_METADATA_URL: ${{ steps.r2.outputs.version_metadata_url }}
          R2_VERSION_PREFIX: ${{ steps.r2.outputs.version_prefix }}
        run: bash .forgejo/scripts/release/r2/summary.sh

  smoke:
    needs: [metadata, publish]
    runs-on: docker
    container:
      image: mirror.perish.lan/ci/deno
    env:
      SIDECAR_RELEASES_PUBLIC_URL: ${{ vars.SIDECAR_RELEASES_PUBLIC_URL }}
      SMOKE_LATEST: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Smoke stable install
        run: sh .forgejo/scripts/release/smoke/smoke.sh "${{ needs.metadata.outputs.release_version }}" stable

  smoke-native:
    needs: [metadata, publish]
    strategy:
      fail-fast: false
      matrix:
        runner: [macos, windows]
    runs-on: ${{ matrix.runner }}
    env:
      SIDECAR_RELEASES_PUBLIC_URL: ${{ vars.SIDECAR_RELEASES_PUBLIC_URL }}
      SMOKE_LATEST: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Smoke stable install on Unix
        if: runner.os != 'Windows'
        run: sh .forgejo/scripts/release/smoke/smoke.sh "${{ needs.metadata.outputs.release_version }}" stable

      - name: Smoke stable install on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./.forgejo/scripts/release/smoke/smoke.ps1 "${{ needs.metadata.outputs.release_version }}" stable
