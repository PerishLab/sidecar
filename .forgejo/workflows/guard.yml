name: guard

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: guard-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    runs-on: docker
    container:
      image: mirror.perish.lan/ci/deno
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Ectropy
        uses: PerishLab/actions/setup-ectropy@main

      - name: Install Plumb
        uses: PerishLab/actions/setup-plumb@main

      - name: Guard
        run: |
          set -eu
          deno run --allow-read "--allow-write=." --allow-env --allow-net "--allow-run=git,cargo,ectropy,plumb,deno,tea,sh,runseal" --config .runseal/deno.json --lock .runseal/deno.lock --frozen=true .runseal/wrappers/guard.ts --fresh

  guard-macos:
    runs-on: macos
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Fetch deps
        run: cargo fetch --locked
      - name: Build
        run: cargo build --locked --workspace

  guard-windows:
    runs-on: windows
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Fetch deps
        run: cargo fetch --locked
      - name: Build
        run: cargo build --locked --workspace
