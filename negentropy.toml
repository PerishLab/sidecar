[scan]
include = [
  "crates/**/*.rs",
  "docs/**/*.md",
]
exclude = [
  "**/target/**",
]

[module]
roots = [
  "crates/*/src",
  "crates/*/tests",
  "docs",
]

[limit]
block = 4
path = 4

[comment]
allow = false

[word]
single = true

[[grant]]
syntax = "test"
paths = ["crates/*/tests/**/*.rs"]

[[grant]]
syntax = "environment"
paths = [
  "crates/cli/src/main.rs",
  "crates/cli/src/args.rs",
  "crates/cli/src/cli.rs",
  "crates/cli/src/commands/runtime.rs",
  "crates/cli/src/update.rs",
  "crates/core/src/paths.rs",
  "crates/*/tests/**/*.rs",
]
